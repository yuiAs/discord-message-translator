<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discord Message Translator</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body class="w-80 p-4">
  <div class="space-y-4">
    <!-- Header -->
    <div class="text-center">
      <h1 class="text-xl font-bold">Discord Translator</h1>
    </div>

    <!-- Auto Translate Toggle -->
    <div class="form-control">
      <label class="label cursor-pointer">
        <span class="label-text">Auto Translate</span>
        <input type="checkbox" id="autoTranslate" class="toggle toggle-primary" checked />
      </label>
    </div>

    <!-- Target Language Selection -->
    <div class="form-control w-full">
      <label class="label">
        <span class="label-text">Target Language</span>
      </label>
      <select id="targetLanguage" class="select select-bordered w-full">
        <option value="ja">Japanese (日本語)</option>
        <option value="en">English</option>
        <option value="ko">Korean (한국어)</option>
        <option value="zh-CN">Chinese Simplified (简体中文)</option>
        <option value="zh-TW">Chinese Traditional (繁體中文)</option>
        <option value="es">Spanish (Español)</option>
        <option value="fr">French (Français)</option>
        <option value="de">German (Deutsch)</option>
        <option value="pt">Portuguese (Português)</option>
        <option value="ru">Russian (Русский)</option>
      </select>
    </div>

    <!-- Translation Mode -->
    <div class="form-control w-full">
      <label class="label">
        <span class="label-text">Translation Mode</span>
      </label>
      <select id="translationMode" class="select select-bordered w-full">
        <option value="replace">Replace Original</option>
        <option value="append">Show Both</option>
      </select>
    </div>

    <!-- Settings Button -->
    <button id="openSettings" class="btn btn-outline btn-sm w-full">
      Settings
    </button>

    <!-- Status Message -->
    <div id="status" class="alert alert-info hidden">
      <span id="statusText"></span>
    </div>
  </div>

  <script type="module" src="./main.ts"></script>
</body>
</html>
